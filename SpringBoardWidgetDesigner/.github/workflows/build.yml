name: Build Sunlight

on:
  workflow_dispatch:
  push:
    paths:
      - 'SpringBoardWidgetDesigner/**'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: SpringBoardWidgetDesigner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1 DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Sunlight-deb
          path: SpringBoardWidgetDesigner/packages/*.deb
          if-no-files-found: error
