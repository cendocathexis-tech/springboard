name: Build Sunlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: waruhachi/theos
          theos-branch: main
          sdks-src: waruhachi/sdks
          sdks-branch: main

      - name: Debug SDK
        run: |
          echo "THEOS=$THEOS"
          echo "SDKs:"
          ls -1 "$THEOS/sdks"

          echo ""
          echo "Preferences:"
          find "$THEOS/sdks" -iname "*Preferences*" -print

          echo ""
          echo "UIUtilities:"
          find "$THEOS/sdks" -iname "*UIUtilities*" -print

          echo ""
          echo "Selected SDK:"
          xcrun --sdk iphoneos --show-sdk-path || true

          echo ""
          echo "iPhoneOS16.5 Preferences contents:"
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework" -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Build Sunlight
        working-directory: SpringBoardWidgetDesigner
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Sunlight-deb
          path: SpringBoardWidgetDesigner/packages/*.deb
          if-no-files-found: error
